name: Native interoperability scenarios

# Reusable by ci.yml (pull request, dispatch), ci-command.yml (a reviewer's
# request for named scenarios on one pull-request commit) and periodic.yml.
# Test code runs with read-only repository permissions and no persisted credential.
on:
  workflow_call:
    inputs:
      matrix:
        description: Matrix JSON produced by tools/scenario_plan.py
        required: true
        type: string
      ref:
        description: Exact commit to test; empty tests the calling event's own revision
        required: false
        type: string
        default: ''
      retention_days:
        description: Scenario result retention in days, as a JSON number
        required: false
        type: string
        default: '7'
      diagnostic_retention_days:
        description: Failed test diagnostic retention in days, as a JSON number
        required: false
        type: string
        default: '14'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ceph:
    if: fromJSON(inputs.matrix).include[0] != null
    name: ${{ matrix.rgw_native == '1' && format('RGW-native-fixture {0} (Ceph 20.2.4 pinned image, {1}/{2}, secure, IPv{3}, container, fixed checkpoint cluster MON=1, MGR=1, OSD=1 BlueStore, gateway=1)', matrix.scenario, matrix.key, matrix.service, matrix.family) || format('{0}{1}{2}Ceph {3} ({4}/{5}, {6}, IPv{7}, MGR={8}, {9}, expiry={10}, idle={11}, auth-epoch={12}, short-tickets={13}, mode-rejection={14}, mapped={15}, OSD={16}, profile={17}, store={18}, replicas={19}, native-mgr-preparation={20}, race={21}{22}){23}{24}', matrix.mon_ping == '1' && 'MON-ping ' || '', matrix.osd_cache_pools == '1' && 'OSD-cache-pools ' || '', matrix.mgr_service == '1' && 'MGR-service ' || '', matrix.release || '20.2.4', matrix.key, matrix.service, matrix.mode || 'secure', matrix.family, matrix.managers || '2', matrix.runtime || 'container', matrix.expiry || '0', matrix.idle || '0', matrix.auth_epoch || '0', matrix.short_tickets || '0', matrix.mode_rejection || 'none', matrix.mapped || '0', matrix.osd || '0', matrix.osd_profile || 'legacy-v6', matrix.osd_store || 'memstore', matrix.osd_replicas || '1', matrix.native_mgr_preparation || '0', matrix.race || '0', matrix.osd_soak && format(', soak={0}', matrix.osd_soak) || '', matrix.rbd == '1' && ' RBD-base' || (matrix.mds_cephfs_ranks_replay == '1' && ' MDS-cephfs-ranks-replay' || (matrix.mds_cephfs_ranks == '1' && ' MDS-cephfs-ranks' || (matrix.mds_cephfs_completion == '1' && ' MDS-cephfs-completion' || (matrix.mds_cephfs_data == '1' && ' MDS-cephfs-data' || (matrix.mds_cephfs == '1' && ' MDS-cephfs' || (matrix.mds_sessions == '1' && ' MDS-sessions' || (matrix.mds_commands == '1' && ' MDS-commands' || (matrix.mds_fresh == '1' && ' MDS-fresh' || '')))))))), matrix.test_sequence && format(' sequence of {0} rows', matrix.sequence_rows) || '') }}
    runs-on: ubuntu-latest
    # A fixture sequence runs up to eight rows' tests on one fixture.
    timeout-minutes: ${{ matrix.test_sequence && 120 || 45 }}
    env:
      GOPROXY: 'https://proxy.golang.org|direct'
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GOWORK: 'off'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(inputs.matrix).include }}
    steps:
      # Keep verdict code from the calling workflow revision. A PR supplies
      # tests and catalog data, not the implementation of the result gate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .trusted-native
          persist-credentials: false
      - name: Preserve the trusted test result gate
        run: |
          cp .trusted-native/tools/native_test_results.py "$RUNNER_TEMP/native_test_results.py"
          # The result gate imports its Go test listing from its own directory.
          cp .trusted-native/tools/go_test_list.py "$RUNNER_TEMP/go_test_list.py"
          # It verifies a routed RGW checkpoint's stream with this gate.
          cp .trusted-native/tools/rgw_native_gate.py "$RUNNER_TEMP/rgw_native_gate.py"
          # The RGW gate loads each checkpoint's receipt check from beside it.
          cp .trusted-native/tools/rgw_native_gate_*.py "$RUNNER_TEMP/"
          cp .trusted-native/tools/native_terminal.py "$RUNNER_TEMP/native_terminal.py"
          cp .trusted-native/tools/native_evidence.py "$RUNNER_TEMP/native_evidence.py"
          # The collector imports its families (native_evidence_<name>.py)
          # from its own directory only.
          cp .trusted-native/tools/native_evidence_*.py "$RUNNER_TEMP/"
          # The soak collector imports this validator from its own directory;
          # the tested checkout's copy is never used for retained evidence.
          cp .trusted-native/tools/osd_soak_receipts.py "$RUNNER_TEMP/osd_soak_receipts.py"
          # The run step forwards the job's matrix to the runner alone with
          # this helper, so no row parameter reaches a trusted step.
          cp .trusted-native/tools/native_env.py "$RUNNER_TEMP/native_env.py"
      - name: Ask the trusted collector for the job's evidence family
        id: evidence_family
        env:
          MATRIX_JSON: ${{ toJSON(matrix) }}
        run: |
          # Empty when no family claims this matrix; later evidence steps run
          # only for a claimed family.
          python3 "$RUNNER_TEMP/native_evidence.py" family >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Bind execution to the requested commit
        env:
          TESTED_SHA: ${{ inputs.ref || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: integration/fixture/go.sum
      - name: Download fixture-only dependencies
        run: go -C integration/fixture mod download
      - name: Identify the fixture image cache
        id: image_cache
        env:
          IMAGE: ${{ matrix.image || 'quay.io/ceph/ceph:v20.2.4@sha256:6bb1c8a42fbc0bf87938946990b65174466997bc11c31eb5a323225a779fd8f9' }}
        run: |
          # Only immutable references may share an archive across runs.
          if [[ "$IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]; then
            digest=$(printf '%s' "$IMAGE" | sha256sum | cut -d ' ' -f 1)
            echo "key=ceph-image-v1-${RUNNER_OS}-${RUNNER_ARCH}-$digest" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore shared fixture image layers
        id: image_restore
        if: steps.image_cache.outputs.key != ''
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ceph-image-cache
          key: ${{ steps.image_cache.outputs.key }}
      - name: Load cached fixture image layers
        if: steps.image_restore.outputs.cache-hit == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # A missing or unusable cache must fall back to the registry.
          docker load --input "$RUNNER_TEMP/ceph-image-cache/image.tar" || true
      - name: Pre-pull the pinned Ceph fixture image
        timeout-minutes: 5
        env:
          IMAGE: ${{ matrix.image || 'quay.io/ceph/ceph:v20.2.4@sha256:6bb1c8a42fbc0bf87938946990b65174466997bc11c31eb5a323225a779fd8f9' }}
        run: |
          # docker save/load can lose RepoDigests. Always pull the original
          # reference to restore its identity, reusing the cached local layers.
          for attempt in 1 2 3; do
            docker pull "$IMAGE" && exit 0
            sleep $((attempt * 10))
          done
          exit 1
      - name: Prepare a bounded shared fixture image archive
        id: image_archive
        # One writer per run, on the scheduled default branch only. Requested
        # PR revisions consume the cache without creating branch copies.
        if: github.event_name == 'schedule' && strategy.job-index == 0 && steps.image_cache.outputs.key != '' && steps.image_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          IMAGE: ${{ matrix.image || 'quay.io/ceph/ceph:v20.2.4@sha256:6bb1c8a42fbc0bf87938946990b65174466997bc11c31eb5a323225a779fd8f9' }}
        run: |
          mkdir -p "$RUNNER_TEMP/ceph-image-cache"
          archive="$RUNNER_TEMP/ceph-image-cache/image.tar"
          docker image save --output "$archive" "$IMAGE"
          if test "$(stat -c %s "$archive")" -le 2147483648; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Fixture image archive exceeds the 2 GiB cache limit; using registry pulls'
            rm -f "$archive"
          fi
      - name: Save shared fixture image layers
        if: steps.image_archive.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ceph-image-cache
          key: ${{ steps.image_cache.outputs.key }}
      - name: Pre-pull the Testcontainers reaper image
        timeout-minutes: 5
        run: |
          for attempt in 1 2 3 4 5; do
            docker pull testcontainers/ryuk:0.14.0 && exit 0
            sleep $((attempt * 10))
          done
          exit 1
      - name: Real MON, MGR and opt-in OSD protocol verification
        id: ceph
        run: |
          sequence=()
          if test -n "$TEST_SEQUENCE"; then sequence=(--sequence); fi
          # A routed RGW checkpoint (rgw_native=1) is bound to the tested
          # revision and to the test2json stream its run creates.
          if test "$RGW_ROUTED" = 1; then
            sequence+=(--backend rgw-fixture --revision "$TESTED_SHA" --stream "$CEPH_MSGR_TEST_DIAGNOSTICS/rgw-native.jsonl")
          fi
          python3 "$RUNNER_TEMP/native_test_results.py" snapshot "${sequence[@]}" \
            --selector "$TEST_SELECTOR" --output "$RUNNER_TEMP/expected-tests.json"
          result=0
          # Only the runner receives the row's fixture inputs: the trusted
          # helper forwards each matrix parameter p as CEPH_MSGR_TEST_<P>
          # (tools/native_env.py), so a new input adds no line here.
          python3 "$RUNNER_TEMP/native_env.py" -- sh integration/run.sh 2>&1 | tee "$RUNNER_TEMP/ceph-tests.log" || result=$?
          if ! python3 "$RUNNER_TEMP/native_test_results.py" verify \
            --expected "$RUNNER_TEMP/expected-tests.json" --log "$RUNNER_TEMP/ceph-tests.log" \
            --output "$RUNNER_TEMP/native-tests.json"; then
            if test "$result" -eq 0; then result=1; fi
          fi
          if test "$result" -ne 0; then
            python3 tools/ci_failure_annotations.py "$RUNNER_TEMP/ceph-tests.log" "$result"
          fi
          exit "$result"
        env:
          TESTED_SHA: ${{ inputs.ref || github.sha }}
          MATRIX_JSON: ${{ toJSON(matrix) }}
          # The result gate's own inputs: the selector, a fixture sequence
          # (tools/scenario_plan.py plan, integration/fixture/sequence.go) and
          # the route of a row with rgw_native=1 to one RGW checkpoint of the
          # fixture module (rgw_native_route.go).
          TEST_SELECTOR: ${{ matrix.test_run || '' }}
          TEST_SEQUENCE: ${{ matrix.test_sequence || '' }}
          RGW_ROUTED: ${{ matrix.rgw_native || '0' }}
          # The one fixture input the workflow sets itself (native_env.RESERVED).
          CEPH_MSGR_TEST_DIAGNOSTICS: ${{ runner.temp }}/ceph-diagnostics
      - name: Confirm that a routed RGW checkpoint left no container
        if: always() && matrix.rgw_native == '1' && steps.ceph.outcome != 'skipped'
        run: |
          # The checkpoint independently confirms its own removal; the gate
          # requires that record. The Testcontainers reaper is the only
          # container the runner keeps.
          leftover=$(docker ps -a --format '{{.Image}}' | { grep -v '^testcontainers/ryuk:' || true; })
          if test -n "$leftover"; then
            printf 'Containers left after the RGW checkpoint: %s\n' "$leftover"
            exit 1
          fi
      - name: Preserve failed Ceph test logs and crash metadata
        if: failure() && steps.ceph.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ceph-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/ceph-tests.log
            ${{ runner.temp }}/ceph-diagnostics/
          retention-days: ${{ fromJSON(inputs.diagnostic_retention_days) }}
          compression-level: 9
      - name: Collect reviewed successful-native evidence
        id: evidence
        if: steps.ceph.outcome == 'success' && steps.evidence_family.outputs.family != ''
        continue-on-error: true
        env:
          TESTED_SHA: ${{ inputs.ref || github.sha }}
          EXECUTION_SOURCE: github-actions
          CONTROLLER_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          MATRIX_JSON: ${{ toJSON(matrix) }}
        run: |
          python3 "$RUNNER_TEMP/native_evidence.py" collect \
            --receipts "$RUNNER_TEMP/ceph-diagnostics" --tests "$RUNNER_TEMP/native-tests.json" \
            --output "$RUNNER_TEMP/success-evidence" --status "$RUNNER_TEMP/evidence-status.json" \
            --provider-pin "$GITHUB_WORKSPACE/integration/fixture/go.mod"
      - name: Preserve reviewed successful-native evidence
        id: evidence_upload
        if: steps.evidence.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-success-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}-${{ matrix.scenario }}
          path: ${{ runner.temp }}/success-evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Require complete evidence for the admitted successful rows
        if: always() && steps.ceph.outcome == 'success' && steps.evidence_family.outputs.family != ''
        env:
          COLLECTION: ${{ steps.evidence.outcome }}
          UPLOAD: ${{ steps.evidence_upload.outcome }}
        run: |
          if test "$COLLECTION:$UPLOAD" != success:success; then
            echo 'Native test passed, but required successful evidence is incomplete.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Record the scenario result
        if: always()
        env:
          SCENARIO: ${{ matrix.scenario }}
          # Every row of a fixture sequence, or the one row.
          SCENARIOS: ${{ matrix.scenarios || matrix.scenario }}
          RESULT: ${{ job.status }}
          TEST_OUTCOME: ${{ steps.ceph.outcome }}
          EVIDENCE_PILOT: ${{ steps.evidence_family.outputs.family != '' }}
          EVIDENCE_COLLECTION: ${{ steps.evidence.outcome }}
          EVIDENCE_UPLOAD: ${{ steps.evidence_upload.outcome }}
          TESTED_SHA: ${{ inputs.ref || github.sha }}
          CONTROLLER_SHA: ${{ github.workflow_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          IMAGE: ${{ matrix.image || 'quay.io/ceph/ceph:v20.2.4@sha256:6bb1c8a42fbc0bf87938946990b65174466997bc11c31eb5a323225a779fd8f9' }}
        run: |
          python3 "$RUNNER_TEMP/native_terminal.py" --directory "$RUNNER_TEMP"
      - name: Preserve the scenario result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scenario-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}-${{ matrix.scenario }}
          path: ${{ runner.temp }}/scenario-result/
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.retention_days) }}
