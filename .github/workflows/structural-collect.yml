name: Structural review evidence

# Report-only and read-only, in a workflow of its own so that the report starts
# with the pull request event and is published when this run ends, without
# waiting for Code checks. It is never a required check, and neither a metric
# value nor a collection failure gates anything. Only a change to library code
# is measured: the classifier runs first, and tests, repository-only helpers,
# documentation and tools alone skip every later step and publish nothing new.
on:
  pull_request:

permissions:
  contents: read

env:
  # A failed request to the module proxy, such as a reset HTTP/2 stream,
  # falls back to the module's origin; go.sum verifies either source.
  GOPROXY: 'https://proxy.golang.org|direct'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  collect:
    name: Collect structural review evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify structural review eligibility
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          MERGE_BASE=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq .merge_base_commit.sha)
          echo "merge_base=$MERGE_BASE" >> "$GITHUB_OUTPUT"
          git fetch --no-tags --depth=1 origin "$BASE" "$HEAD" "$MERGE_BASE"
          python3 .github/scripts/structural_review.py --classify --base "$MERGE_BASE" --head "$HEAD"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.eligible == 'true'
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false
      # The same pinned linter as Code checks' lint step.
      - name: Install the pinned linter
        if: steps.scope.outputs.eligible == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - name: Collect report-only structural review evidence
        id: structural
        if: steps.scope.outputs.eligible == 'true'
        continue-on-error: true
        timeout-minutes: 6
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE: ${{ steps.scope.outputs.merge_base }}
        run: python3 .github/scripts/structural_review.py --base "$MERGE_BASE" --head "$HEAD" --target-base "$BASE" --output "$RUNNER_TEMP/structural-review"
      - name: Save structural review evidence
        if: ${{ always() && steps.structural.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: structural-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/structural-review/
          retention-days: 7
          if-no-files-found: warn
