name: Basic CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One automatic run per PR; a new commit cancels its previous checks.
concurrency:
  group: basic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOPROXY: 'https://proxy.golang.org|direct'
  CGO_ENABLED: '0'
  GOTOOLCHAIN: local
  GOWORK: 'off'

jobs:
  basic:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.0'
      - name: Check Go formatting
        run: |
          files=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if test -n "$files"; then printf '%s\n' "$files"; exit 1; fi
      - name: Test Python tools and validate scenarios
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/scenario_plan.py validate
      - name: Build and lint the product
        run: |
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
          python3 tools/product_dependencies.py
      - name: Unit tests without integration tests
        run: |
          packages=$(go list -mod=readonly ./... | sed '\|/integration$|d; \|/integration/|d')
          go test -mod=readonly $packages
      - name: Race detector on unit tests without integration tests
        env:
          CGO_ENABLED: '1'
        run: |
          packages=$(go list -mod=readonly ./... | sed '\|/integration$|d; \|/integration/|d')
          go test -mod=readonly -race $packages
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes=

  fixture-static:
    name: Fixture build and unit checks without a cluster
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: integration/fixture/go.sum
      - name: Build and lint fixture tools
        run: |
          go -C integration/fixture build -mod=readonly ./...
          go -C integration/fixture vet -mod=readonly ./...
      - name: Unit test fixture tools without a cluster
        run: go -C integration/fixture test -mod=readonly ./...
